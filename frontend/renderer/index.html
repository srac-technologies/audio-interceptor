<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .status-idle {
      background: rgba(255, 255, 255, 0.2);
    }

    .status-standby {
      background: rgba(255, 193, 7, 0.8);
      color: #000;
    }

    .status-active {
      background: rgba(76, 175, 80, 0.8);
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 15px 30px;
      font-size: 1.1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .btn-start {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-stop {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }

    .transcript-area {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      min-height: 300px;
      max-height: 500px;
      overflow-y: auto;
    }

    .transcript-item {
      margin-bottom: 15px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }

    .transcript-speaker {
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 5px;
    }

    .transcript-mic {
      font-weight: bold;
      color: #87ceeb;
      margin-bottom: 5px;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      opacity: 0.7;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Meeting Assistant</h1>
    
    <div class="status-card">
      <span class="status-badge status-idle" id="statusBadge">待機中 (Idle)</span>
      <h2>システムステータス</h2>
      <p id="statusText">会議を待機しています...</p>
      
      <div class="controls">
        <button class="btn-start" id="startBtn">会議を開始</button>
        <button class="btn-stop" id="stopBtn" disabled>会議を終了</button>
      </div>
      
      <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2);">
        <label style="display: block; margin-bottom: 10px; font-weight: bold;">会議種別（AIアドバイス用）</label>
        <select id="meetingTypeSelect" style="width: 100%; padding: 10px; border-radius: 5px; border: none; background: rgba(255,255,255,0.2); color: white; font-size: 1rem;">
          <option value="">選択してください（アドバイスなし）</option>
        </select>
      </div>

      <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2);">
        <label style="display: flex; align-items: center; cursor: pointer;">
          <input type="checkbox" id="transcribeCheckbox" style="margin-right: 10px; width: 20px; height: 20px;">
          <span>文字起こしを有効にする（Whisper API）</span>
        </label>
      </div>
    </div>

    <div class="transcript-area" id="transcriptArea">
      <p style="text-align: center; opacity: 0.5;">文字起こしがここに表示されます</p>
    </div>

    <div class="footer">
      Meeting Assistant v0.1.0 - Powered by Whisper & Electron
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let isRecording = false;

    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const transcriptArea = document.getElementById('transcriptArea');
    const transcribeCheckbox = document.getElementById('transcribeCheckbox');
    const meetingTypeSelect = document.getElementById('meetingTypeSelect');
    
    // 会議種別をロード
    async function loadMeetingTypes() {
      try {
        const response = await fetch('http://localhost:8000/meeting-types');
        const data = await response.json();
        
        data.meeting_types.forEach(type => {
          const option = document.createElement('option');
          option.value = type.id;
          option.textContent = type.name;
          option.title = type.description;
          meetingTypeSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Failed to load meeting types:', error);
      }
    }
    
    loadMeetingTypes();
    
    // WebSocket接続管理
    let ws = null;
    let reconnectTimer = null;

    function connectWebSocket() {
      ws = new WebSocket('ws://localhost:8000/ws');

      ws.onopen = () => {
        console.log('✅ WebSocket Connected');
        if (reconnectTimer) {
          clearInterval(reconnectTimer);
          reconnectTimer = null;
        }
      };

      ws.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          
          if (message.type === 'transcript') {
            addTranscript(message.source, message.text);
          } else if (message.type === 'status') {
            // サーバーからのステータス同期
            if (message.recording && !isRecording) {
              isRecording = true;
              updateStatus('active');
              startBtn.disabled = true;
              stopBtn.disabled = false;
              transcribeCheckbox.disabled = true;
            } else if (!message.recording && isRecording) {
              isRecording = false;
              updateStatus('idle');
              startBtn.disabled = false;
              stopBtn.disabled = true;
              transcribeCheckbox.disabled = false;
            }
          }
        } catch (e) {
          console.error('Failed to parse WebSocket message:', e);
        }
      };

      ws.onclose = () => {
        console.log('❌ WebSocket Disconnected');
        // 再接続ロジック
        if (!reconnectTimer) {
          reconnectTimer = setInterval(() => {
            console.log('🔄 Reconnecting WebSocket...');
            connectWebSocket();
          }, 3000);
        }
      };

      ws.onerror = (err) => {
        console.error('WebSocket Error:', err);
        ws.close();
      };
    }

    // 初期化時に接続開始
    connectWebSocket();

    startBtn.addEventListener('click', async () => {
      try {
        const options = {
          transcribe: transcribeCheckbox.checked,
          meeting_type_id: meetingTypeSelect.value ? parseInt(meetingTypeSelect.value) : null
        };
        
        const result = await ipcRenderer.invoke('start-recording', options);
        if (result.success) {
          isRecording = true;
          updateStatus('active');
          startBtn.disabled = true;
          stopBtn.disabled = false;
          transcribeCheckbox.disabled = true;
          meetingTypeSelect.disabled = true;
        } else {
          alert(`録音開始エラー: ${result.message || '不明なエラー'}`);
        }
      } catch (error) {
        alert(`録音開始エラー: ${error.message}`);
      }
    });

    stopBtn.addEventListener('click', async () => {
      try {
        const result = await ipcRenderer.invoke('stop-recording');
        if (result.success) {
          isRecording = false;
          updateStatus('idle');
          startBtn.disabled = false;
          stopBtn.disabled = true;
          transcribeCheckbox.disabled = false;
          meetingTypeSelect.disabled = false;
        } else {
          alert(`録音停止エラー: ${result.message || '不明なエラー'}`);
        }
      } catch (error) {
        alert(`録音停止エラー: ${error.message}`);
      }
    });

    function updateStatus(status) {
      statusBadge.className = 'status-badge';
      
      switch (status) {
        case 'idle':
          statusBadge.classList.add('status-idle');
          statusBadge.textContent = '待機中 (Idle)';
          statusText.textContent = '会議を待機しています...';
          break;
        case 'standby':
          statusBadge.classList.add('status-standby');
          statusBadge.textContent = '準備中 (Standby)';
          statusText.textContent = '会議が検知されました。開始しますか？';
          break;
        case 'active':
          statusBadge.classList.add('status-active');
          statusBadge.textContent = '録音中 (Active)';
          statusText.textContent = '会議を録音・文字起こし中...';
          break;
      }
    }

    function addTranscript(source, text) {
      const item = document.createElement('div');
      item.className = 'transcript-item';
      
      const label = document.createElement('div');
      label.className = source === 'speaker' ? 'transcript-speaker' : 'transcript-mic';
      label.textContent = source === 'speaker' ? '🔊 Speaker' : '🎤 Microphone';
      
      const content = document.createElement('div');
      content.textContent = text;
      
      item.appendChild(label);
      item.appendChild(content);
      
      // 最初の説明テキストをクリア
      if (transcriptArea.children.length === 1 && 
          transcriptArea.children[0].tagName === 'P') {
        transcriptArea.innerHTML = '';
      }
      
      transcriptArea.appendChild(item);
      transcriptArea.scrollTop = transcriptArea.scrollHeight;
    }
  </script>
</body>
</html>
