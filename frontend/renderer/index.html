<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Assistant</title>
  <link rel="stylesheet" href="../shared/css/theme.css">
</head>
<body>
  <div class="ma-container">
    <!-- ヘッダー -->
    <div class="ma-header">
      <h1>MEETING_ASSISTANT</h1>
      <div class="ma-header-buttons">
        <div class="ma-connection-dot" id="connectionDot" title="未接続"></div>
        <button id="historyBtn">履歴</button>
        <button id="settingsBtn">設定</button>
      </div>
    </div>

    <!-- ステータスバー -->
    <div class="ma-status-bar">
      <div class="ma-status-indicator" id="statusIndicator"></div>
      <span id="statusText">待機中</span>
      <button class="ma-btn ma-btn-mute" id="muteMicBtn" style="display:none; margin-left:auto;">マイクON</button>
      <button class="ma-btn ma-btn-stop" id="stopBtnFloating" style="display:none; flex:0; width:auto; padding:8px 20px;">会議を終了</button>
    </div>

    <!-- コントロールパネル -->
    <details class="ma-controls-collapsible" id="controlsDetails" open>
      <summary>コントロール</summary>
      <div class="ma-controls-content">
        <div class="ma-form-group">
          <label>ミーティングタイトル</label>
          <div style="display:flex; gap:8px;">
            <input type="text" class="ma-input" id="meetingTitle" placeholder="例: 週次定例、営業商談、採用面接..." style="flex:1;">
            <button id="fetchCalendarBtn" class="ma-btn" style="width:auto; padding:8px 12px; font-size:0.85rem; background:rgba(100,150,255,0.2); color:var(--color-mic); border:1px solid var(--color-mic);">カレンダー</button>
          </div>
        </div>

        <div class="ma-form-group">
          <label>会議種別</label>
          <select class="ma-select" id="meetingTypeSelect">
            <option value="">選択してください</option>
          </select>
        </div>

        <div class="ma-form-group">
          <label class="ma-checkbox-group">
            <input type="checkbox" id="transcribeCheckbox" checked>
            <span>文字起こしを有効にする</span>
          </label>
        </div>

        <div class="ma-controls" style="margin-top: 12px;">
          <button class="ma-btn ma-btn-start" id="startBtn">会議を開始</button>
          <button class="ma-btn ma-btn-stop" id="stopBtn" disabled>会議を終了</button>
        </div>
      </div>
    </details>

    <!-- メインエリア -->
    <div class="ma-main-area">
      <!-- 文字起こしパネル -->
      <div class="ma-panel" style="flex:2;">
        <div class="ma-panel-header">TRANSCRIPT</div>
        <div class="ma-panel-content" id="transcriptArea" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>

      <!-- AIリサーチパネル -->
      <div class="ma-panel">
        <div class="ma-panel-header">AI_RESEARCH</div>
        <div class="ma-panel-content" id="adviceArea"></div>
      </div>
    </div>
  </div>

  <!-- モーダルは JavaScript で動的に生成される -->

  <script src="app.js" type="module"></script>
</body>
</html>
