<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .status-idle {
      background: rgba(255, 255, 255, 0.2);
    }

    .status-standby {
      background: rgba(255, 193, 7, 0.8);
      color: #000;
    }

    .status-active {
      background: rgba(76, 175, 80, 0.8);
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 15px 30px;
      font-size: 1.1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .btn-start {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-stop {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }

    .transcript-area {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      min-height: 300px;
      max-height: 500px;
      overflow-y: auto;
    }

    .transcript-item {
      margin-bottom: 15px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }

    .transcript-speaker {
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 5px;
    }

    .transcript-mic {
      font-weight: bold;
      color: #87ceeb;
      margin-bottom: 5px;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      opacity: 0.7;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Meeting Assistant</h1>
    
    <div style="position: absolute; top: 20px; right: 20px;">
      <button id="settingsBtn" style="background: rgba(255,255,255,0.2); padding: 8px 15px; font-size: 0.9rem;">
        ⚙️ 設定
      </button>
    </div>
    
    <div class="status-card">
      <span class="status-badge status-idle" id="statusBadge">待機中 (Idle)</span>
      <h2>システムステータス</h2>
      <p id="statusText">会議を待機しています...</p>
      
      <div class="controls">
        <button class="btn-start" id="startBtn">会議を開始</button>
        <button class="btn-stop" id="stopBtn" disabled>会議を終了</button>
      </div>
      
      <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2);">
        <label style="display: block; margin-bottom: 10px; font-weight: bold;">会議種別（AIアドバイス用）</label>
        <select id="meetingTypeSelect" style="width: 100%; padding: 10px; border-radius: 5px; border: none; background: rgba(255,255,255,0.2); color: white; font-size: 1rem;">
          <option value="">選択してください（アドバイスなし）</option>
        </select>
      </div>

      <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2);">
        <label style="display: flex; align-items: center; cursor: pointer;">
          <input type="checkbox" id="transcribeCheckbox" style="margin-right: 10px; width: 20px; height: 20px;">
          <span>文字起こしを有効にする（Whisper API）</span>
        </label>
      </div>
    </div>

    <div class="transcript-area" id="transcriptArea">
      <p style="text-align: center; opacity: 0.5;">文字起こしがここに表示されます</p>
    </div>

    <div class="footer">
      Meeting Assistant v0.1.0 - Powered by Whisper & Electron
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: #2d3748; width: 90%; max-width: 1000px; height: 80%; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; color: white;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
        <h2>マスタ管理</h2>
        <button id="closeSettingsBtn" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">&times;</button>
      </div>
      
      <div style="display: flex; flex: 1; gap: 20px; overflow: hidden;">
        <!-- Left Pane: Meeting Types -->
        <div style="flex: 1; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 20px;">
          <h3>会議種別</h3>
          <div id="meetingTypeList" style="flex: 1; overflow-y: auto; margin: 10px 0; background: rgba(0,0,0,0.2); border-radius: 5px; padding: 10px;">
            <!-- List items will go here -->
          </div>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="newTypeName" placeholder="種別名" style="flex: 1; padding: 8px; border-radius: 4px; border: none;">
            <button id="addTypeBtn" style="background: #48bb78; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer;">追加</button>
          </div>
        </div>
        
        <!-- Right Pane: Prompts -->
        <div style="flex: 2; display: flex; flex-direction: column;">
          <h3 id="promptsHeader">プロンプト設定 (選択してください)</h3>
          <div id="promptsList" style="flex: 1; overflow-y: auto; margin: 10px 0; background: rgba(0,0,0,0.2); border-radius: 5px; padding: 10px;">
            <!-- Prompts will go here -->
          </div>
          <div id="promptForm" style="display: none; flex-direction: column; gap: 10px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 5px;">
            <input type="text" id="newTrigger" placeholder="トリガー条件 (例: 価格が高いと言われた時)" style="padding: 8px; border-radius: 4px; border: none;">
            <textarea id="newAction" placeholder="AIへの指示 (例: ROIを強調する提案をして)" style="padding: 8px; border-radius: 4px; border: none; height: 60px;"></textarea>
            <button id="addPromptBtn" style="background: #48bb78; color: white; padding: 8px; border: none; border-radius: 4px; cursor: pointer;">プロンプトを追加</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let isRecording = false;

    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const transcriptArea = document.getElementById('transcriptArea');
    const transcribeCheckbox = document.getElementById('transcribeCheckbox');
    const meetingTypeSelect = document.getElementById('meetingTypeSelect');
    
    // --- Settings UI Logic ---
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const meetingTypeList = document.getElementById('meetingTypeList');
    const promptsList = document.getElementById('promptsList');
    const promptsHeader = document.getElementById('promptsHeader');
    const promptForm = document.getElementById('promptForm');
    
    let selectedTypeId = null;

    settingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'flex';
      renderMeetingTypes();
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'none';
      loadMeetingTypes(); // Refresh main dropdown
    });

    // 会議種別一覧のレンダリング
    async function renderMeetingTypes() {
      const response = await fetch('http://localhost:8000/meeting-types');
      const data = await response.json();
      
      meetingTypeList.innerHTML = '';
      data.meeting_types.forEach(type => {
        const item = document.createElement('div');
        item.style.padding = '10px';
        item.style.borderBottom = '1px solid rgba(255,255,255,0.1)';
        item.style.cursor = 'pointer';
        item.style.display = 'flex';
        item.style.justifyContent = 'space-between';
        
        if (selectedTypeId === type.id) {
          item.style.background = 'rgba(66, 153, 225, 0.5)';
        }
        
        const nameSpan = document.createElement('span');
        nameSpan.textContent = type.name;
        
        const delBtn = document.createElement('button');
        delBtn.textContent = '×';
        delBtn.style.padding = '2px 8px';
        delBtn.style.background = '#e53e3e';
        delBtn.style.fontSize = '0.8rem';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteMeetingType(type.id);
        };
        
        item.appendChild(nameSpan);
        item.appendChild(delBtn);
        
        item.onclick = () => selectType(type);
        meetingTypeList.appendChild(item);
      });
    }

    function selectType(type) {
      selectedTypeId = type.id;
      promptsHeader.textContent = `${type.name} のプロンプト設定`;
      promptForm.style.display = 'flex';
      renderMeetingTypes(); // Update highlight
      renderPrompts(type.id);
    }

    // プロンプト一覧のレンダリング
    async function renderPrompts(typeId) {
      const response = await fetch(`http://localhost:8000/meeting-types/${typeId}/prompts`);
      const data = await response.json();
      
      promptsList.innerHTML = '';
      data.prompts.forEach(prompt => {
        const item = document.createElement('div');
        item.style.background = 'rgba(255,255,255,0.05)';
        item.style.padding = '10px';
        item.style.marginBottom = '10px';
        item.style.borderRadius = '5px';
        
        const header = document.createElement('div');
        header.style.display = 'flex';
        header.style.justifyContent = 'space-between';
        header.style.marginBottom = '5px';
        
        const trigger = document.createElement('div');
        trigger.style.fontWeight = 'bold';
        trigger.style.color = '#fbd38d';
        trigger.textContent = `条件: ${prompt.trigger_condition}`;
        
        const delBtn = document.createElement('button');
        delBtn.textContent = '削除';
        delBtn.style.padding = '2px 8px';
        delBtn.style.background = '#e53e3e';
        delBtn.style.fontSize = '0.8rem';
        delBtn.onclick = () => deletePrompt(prompt.id);
        
        header.appendChild(trigger);
        header.appendChild(delBtn);
        
        const action = document.createElement('div');
        action.textContent = `指示: ${prompt.action_prompt}`;
        action.style.fontSize = '0.9rem';
        action.style.opacity = '0.8';
        
        item.appendChild(header);
        item.appendChild(action);
        promptsList.appendChild(item);
      });
    }

    // 作成・削除処理
    document.getElementById('addTypeBtn').addEventListener('click', async () => {
      const nameInput = document.getElementById('newTypeName');
      if (!nameInput.value) return;
      
      await fetch('http://localhost:8000/meeting-types', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: nameInput.value })
      });
      nameInput.value = '';
      renderMeetingTypes();
    });

    async function deleteMeetingType(id) {
      if (!confirm('この種別と関連するプロンプトを全て削除しますか？')) return;
      await fetch(`http://localhost:8000/meeting-types/${id}`, { method: 'DELETE' });
      if (selectedTypeId === id) {
        selectedTypeId = null;
        promptsList.innerHTML = '';
        promptForm.style.display = 'none';
        promptsHeader.textContent = 'プロンプト設定 (選択してください)';
      }
      renderMeetingTypes();
    }

    document.getElementById('addPromptBtn').addEventListener('click', async () => {
      const trigger = document.getElementById('newTrigger');
      const action = document.getElementById('newAction');
      
      if (!selectedTypeId || !trigger.value || !action.value) return;
      
      await fetch('http://localhost:8000/prompts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          meeting_type_id: selectedTypeId,
          trigger_condition: trigger.value,
          action_prompt: action.value
        })
      });
      trigger.value = '';
      action.value = '';
      renderPrompts(selectedTypeId);
    });

    async function deletePrompt(id) {
      if (!confirm('削除しますか？')) return;
      await fetch(`http://localhost:8000/prompts/${id}`, { method: 'DELETE' });
      renderPrompts(selectedTypeId);
    }

    // 会議種別をロード (初期化)
    async function loadMeetingTypes() {
      try {
        const response = await fetch('http://localhost:8000/meeting-types');
        const data = await response.json();
        
        data.meeting_types.forEach(type => {
          const option = document.createElement('option');
          option.value = type.id;
          option.textContent = type.name;
          option.title = type.description;
          meetingTypeSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Failed to load meeting types:', error);
      }
    }
    
    loadMeetingTypes();
    
    // WebSocket接続管理
    let ws = null;
    let reconnectTimer = null;

    function connectWebSocket() {
      ws = new WebSocket('ws://localhost:8000/ws');

      ws.onopen = () => {
        console.log('✅ WebSocket Connected');
        if (reconnectTimer) {
          clearInterval(reconnectTimer);
          reconnectTimer = null;
        }
      };

      ws.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          
          if (message.type === 'transcript') {
            addTranscript(message.source, message.text);
          } else if (message.type === 'status') {
            // サーバーからのステータス同期
            if (message.recording && !isRecording) {
              isRecording = true;
              updateStatus('active');
              startBtn.disabled = true;
              stopBtn.disabled = false;
              transcribeCheckbox.disabled = true;
            } else if (!message.recording && isRecording) {
              isRecording = false;
              updateStatus('idle');
              startBtn.disabled = false;
              stopBtn.disabled = true;
              transcribeCheckbox.disabled = false;
            }
          }
        } catch (e) {
          console.error('Failed to parse WebSocket message:', e);
        }
      };

      ws.onclose = () => {
        console.log('❌ WebSocket Disconnected');
        // 再接続ロジック
        if (!reconnectTimer) {
          reconnectTimer = setInterval(() => {
            console.log('🔄 Reconnecting WebSocket...');
            connectWebSocket();
          }, 3000);
        }
      };

      ws.onerror = (err) => {
        console.error('WebSocket Error:', err);
        ws.close();
      };
    }

    // 初期化時に接続開始
    connectWebSocket();

    startBtn.addEventListener('click', async () => {
      try {
        const options = {
          transcribe: transcribeCheckbox.checked,
          meeting_type_id: meetingTypeSelect.value ? parseInt(meetingTypeSelect.value) : null
        };
        
        const result = await ipcRenderer.invoke('start-recording', options);
        if (result.success) {
          isRecording = true;
          updateStatus('active');
          startBtn.disabled = true;
          stopBtn.disabled = false;
          transcribeCheckbox.disabled = true;
          meetingTypeSelect.disabled = true;
        } else {
          alert(`録音開始エラー: ${result.message || '不明なエラー'}`);
        }
      } catch (error) {
        alert(`録音開始エラー: ${error.message}`);
      }
    });

    stopBtn.addEventListener('click', async () => {
      try {
        const result = await ipcRenderer.invoke('stop-recording');
        if (result.success) {
          isRecording = false;
          updateStatus('idle');
          startBtn.disabled = false;
          stopBtn.disabled = true;
          transcribeCheckbox.disabled = false;
          meetingTypeSelect.disabled = false;
        } else {
          alert(`録音停止エラー: ${result.message || '不明なエラー'}`);
        }
      } catch (error) {
        alert(`録音停止エラー: ${error.message}`);
      }
    });

    function updateStatus(status) {
      statusBadge.className = 'status-badge';
      
      switch (status) {
        case 'idle':
          statusBadge.classList.add('status-idle');
          statusBadge.textContent = '待機中 (Idle)';
          statusText.textContent = '会議を待機しています...';
          break;
        case 'standby':
          statusBadge.classList.add('status-standby');
          statusBadge.textContent = '準備中 (Standby)';
          statusText.textContent = '会議が検知されました。開始しますか？';
          break;
        case 'active':
          statusBadge.classList.add('status-active');
          statusBadge.textContent = '録音中 (Active)';
          statusText.textContent = '会議を録音・文字起こし中...';
          break;
      }
    }

    function addTranscript(source, text) {
      const item = document.createElement('div');
      item.className = 'transcript-item';
      
      const label = document.createElement('div');
      label.className = source === 'speaker' ? 'transcript-speaker' : 'transcript-mic';
      label.textContent = source === 'speaker' ? '🔊 Speaker' : '🎤 Microphone';
      
      const content = document.createElement('div');
      content.textContent = text;
      
      item.appendChild(label);
      item.appendChild(content);
      
      // 最初の説明テキストをクリア
      if (transcriptArea.children.length === 1 && 
          transcriptArea.children[0].tagName === 'P') {
        transcriptArea.innerHTML = '';
      }
      
      transcriptArea.appendChild(item);
      transcriptArea.scrollTop = transcriptArea.scrollHeight;
    }
  </script>
</body>
</html>
