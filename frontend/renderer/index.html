<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      background: rgba(10, 15, 20, 0.95);
      color: #e0e0e0;
      padding: 0;
      overflow: hidden;
      -webkit-app-region: drag; /* ツールバー無しでもドラッグ可能 */
    }

    button, input, select, textarea, details {
      -webkit-app-region: no-drag; /* これらの要素はドラッグ不可 */
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: rgba(20, 25, 30, 0.8);
      border: 1px solid rgba(0, 255, 170, 0.2);
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 500;
      color: #00ffaa;
      letter-spacing: 1px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    .header-buttons button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #888;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .header-buttons button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 15px;
      background: rgba(20, 25, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .btn-stop-floating {
      margin-left: auto;
      background: #ff4757;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-stop-floating:hover {
      background: #ee3344;
      transform: translateY(-1px);
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
      animation: pulse 2s infinite;
    }

    .status-indicator.active {
      background: #00ffaa;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .controls {
      background: rgba(20, 25, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    details summary {
      padding: 12px 15px;
      cursor: pointer;
      user-select: none;
      font-size: 0.9rem;
      font-weight: 500;
      color: #888;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    details summary::-webkit-details-marker {
      display: none;
    }

    details summary::before {
      content: '▶';
      font-size: 0.7rem;
      transition: transform 0.2s;
    }

    details[open] summary::before {
      transform: rotate(90deg);
    }

    details summary:hover {
      color: #fff;
    }

    .controls-content {
      padding: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #888;
      font-weight: 500;
    }

    input[type="text"], select {
      width: 100%;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #00ffaa;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 10px;
      font-size: 0.95rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-start {
      background: #00ffaa;
      color: #0a0f14;
    }

    .btn-start:hover:not(:disabled) {
      background: #00dd99;
    }

    .btn-stop {
      background: #ff4757;
      color: #fff;
    }

    .btn-stop:hover:not(:disabled) {
      background: #ee3344;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .main-area {
      flex: 1;
      display: flex;
      gap: 10px;
      min-height: 0;
    }

    .transcript-panel {
      flex: 2;
      display: flex;
      flex-direction: column;
      background: rgba(20, 25, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      font-weight: 500;
      color: #888;
    }

    .transcript-content {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .transcript-bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .transcript-bubble.speaker {
      align-self: flex-start;
      background: rgba(0, 255, 170, 0.08);
      border-left: 3px solid #00ffaa;
    }

    .transcript-bubble.mic {
      align-self: flex-end;
      background: rgba(100, 150, 255, 0.08);
      border-right: 3px solid #6496ff;
    }

    .bubble-label {
      font-size: 0.7rem;
      opacity: 0.6;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .bubble-label.speaker { color: #00ffaa; }
    .bubble-label.mic { color: #6496ff; }

    .advice-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(20, 25, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      overflow: hidden;
    }

    .advice-content {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .advice-item {
      background: rgba(255, 200, 100, 0.05);
      border-left: 3px solid #ffc864;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .advice-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      opacity: 0.6;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #444;
      font-size: 0.85rem;
    }

    /* スクロールバー */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* モーダル共通スタイル */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: rgba(15, 20, 25, 0.98);
      border: 1px solid rgba(0, 255, 170, 0.2);
      width: 90%;
      max-width: 1000px;
      height: 80%;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-header h2 {
      font-size: 1.2rem;
      color: #00ffaa;
    }

    .close-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
    }

    .close-btn:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <div class="header">
      <h1>⚡ MEETING_ASSISTANT</h1>
      <div class="header-buttons">
        <button id="historyBtn">履歴</button>
        <button id="settingsBtn">設定</button>
      </div>
    </div>

    <!-- ステータスバー -->
    <div class="status-bar">
      <div class="status-indicator" id="statusIndicator"></div>
      <span id="statusText">待機中</span>
      <button class="btn-stop-floating" id="stopBtnFloating" style="display: none;">⏹ 会議を終了</button>
    </div>

    <!-- コントロールパネル（折りたたみ可能） -->
    <details class="controls" id="controlsDetails" open>
      <summary>コントロール</summary>
      <div class="controls-content">
        <div class="form-group">
          <label>ミーティングタイトル</label>
          <input type="text" id="meetingTitle" placeholder="例: 週次定例、営業商談、採用面接...">
        </div>

        <div class="form-group">
          <label>会議種別（AIアドバイス用）</label>
          <select id="meetingTypeSelect">
            <option value="">選択してください（アドバイスなし）</option>
          </select>
        </div>

        <div class="form-group">
          <label class="checkbox-group">
            <input type="checkbox" id="transcribeCheckbox" checked>
            <span>文字起こしを有効にする</span>
          </label>
        </div>

        <div class="button-group">
          <button class="btn-start" id="startBtn">会議を開始</button>
          <button class="btn-stop" id="stopBtn" disabled>会議を終了</button>
        </div>
      </div>
    </details>

    <!-- メインエリア -->
    <div class="main-area">
      <!-- 文字起こしパネル -->
      <div class="transcript-panel">
        <div class="panel-header">TRANSCRIPT</div>
        <div class="transcript-content" id="transcriptArea">
          <div class="empty-state">文字起こしがここに表示されます</div>
        </div>
      </div>

      <!-- AIアドバイスパネル -->
      <div class="advice-panel">
        <div class="panel-header">AI_ADVICE</div>
        <div class="advice-content" id="adviceArea">
          <div class="empty-state">アドバイスがここに表示されます</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 履歴モーダル -->
  <div id="historyModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>履歴</h2>
        <button class="close-btn" id="closeHistoryBtn">&times;</button>
      </div>
      <div style="flex: 1; overflow: auto;">
        <div id="sessionList"></div>
        <div id="historyDetailContent"></div>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>設定</h2>
        <button class="close-btn" id="closeSettingsBtn">&times;</button>
      </div>
      <div style="flex: 1; display: flex; gap: 20px;">
        <div style="flex: 1;">
          <h3>会議種別</h3>
          <div id="meetingTypeList"></div>
          <input type="text" id="newTypeName" placeholder="種別名">
          <button id="addTypeBtn">追加</button>
        </div>
        <div style="flex: 2;">
          <h3 id="promptsHeader">プロンプト</h3>
          <div id="promptsList"></div>
          <div id="promptForm" style="display: none;">
            <input type="text" id="newTrigger" placeholder="トリガー条件">
            <textarea id="newAction" placeholder="AIへの指示"></textarea>
            <button id="addPromptBtn">追加</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let isRecording = false;
    let ws = null;

    const statusIndicator = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const transcriptArea = document.getElementById('transcriptArea');
    const adviceArea = document.getElementById('adviceArea');
    const transcribeCheckbox = document.getElementById('transcribeCheckbox');
    const meetingTypeSelect = document.getElementById('meetingTypeSelect');
    const meetingTitle = document.getElementById('meetingTitle');
    const controlsDetails = document.getElementById('controlsDetails');
    const stopBtnFloating = document.getElementById('stopBtnFloating');

    // WebSocket接続
    function connectWebSocket() {
      ws = new WebSocket('ws://localhost:8000/ws');
      
      ws.onopen = () => {
        console.log('✅ WebSocket Connected');
        loadMeetingTypes();
      };

      ws.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          
          if (message.type === 'transcript') {
            addTranscript(message.source, message.text);
          } else if (message.type === 'advice') {
            addAdvice(message);
          } else if (message.type === 'status') {
            if (message.recording && !isRecording) {
              isRecording = true;
              updateStatus(true);
            } else if (!message.recording && isRecording) {
              isRecording = false;
              updateStatus(false);
            }
          }
        } catch (e) {
          console.error('WebSocket message parse error:', e);
        }
      };

      ws.onclose = () => {
        console.log('❌ WebSocket Disconnected');
        setTimeout(connectWebSocket, 3000);
      };
    }

    connectWebSocket();

    // ステータス更新
    function updateStatus(recording) {
      if (recording) {
        statusIndicator.classList.add('active');
        statusText.textContent = '録音中';
        startBtn.disabled = true;
        stopBtn.disabled = false;
        transcribeCheckbox.disabled = true;
        // 記録開始時にコントロールを折りたたむ
        controlsDetails.open = false;
        // フローティング停止ボタンを表示
        stopBtnFloating.style.display = 'block';
      } else {
        statusIndicator.classList.remove('active');
        statusText.textContent = '待機中';
        startBtn.disabled = false;
        stopBtn.disabled = true;
        transcribeCheckbox.disabled = false;
        // 記録停止時にコントロールを開く
        controlsDetails.open = true;
        // フローティング停止ボタンを非表示
        stopBtnFloating.style.display = 'none';
      }
    }

    // 文字起こし追加（チャット風バブル）
    function addTranscript(source, text) {
      // 空のステートを削除
      if (transcriptArea.querySelector('.empty-state')) {
        transcriptArea.innerHTML = '';
      }

      const bubble = document.createElement('div');
      bubble.className = `transcript-bubble ${source}`;
      
      const label = document.createElement('div');
      label.className = `bubble-label ${source}`;
      label.textContent = source === 'speaker' ? '🔊 Speaker' : '🎤 Mic';
      
      const content = document.createElement('div');
      content.textContent = text;
      
      bubble.appendChild(label);
      bubble.appendChild(content);
      transcriptArea.appendChild(bubble);
      transcriptArea.scrollTop = transcriptArea.scrollHeight;
    }

    // アドバイス追加
    function addAdvice(data) {
      if (adviceArea.querySelector('.empty-state')) {
        adviceArea.innerHTML = '';
      }

      const item = document.createElement('div');
      item.className = 'advice-item';
      
      const header = document.createElement('div');
      header.className = 'advice-header';
      header.innerHTML = `<span>💡 ${data.trigger}</span><span>${new Date().toLocaleTimeString()}</span>`;
      
      const content = document.createElement('div');
      content.textContent = data.text;
      
      item.appendChild(header);
      item.appendChild(content);
      adviceArea.appendChild(item);
      adviceArea.scrollTop = adviceArea.scrollHeight;
    }

    // 会議開始
    startBtn.addEventListener('click', async () => {
      try {
        const options = {
          transcribe_enabled: transcribeCheckbox.checked,
          meeting_type_id: meetingTypeSelect.value ? parseInt(meetingTypeSelect.value) : null,
          title: meetingTitle.value || '無題の会議'
        };

        const result = await ipcRenderer.invoke('start-recording', options);
        if (result.success) {
          transcriptArea.innerHTML = '';
          adviceArea.innerHTML = '';
          isRecording = true;
          updateStatus(true);
        } else {
          alert(`録音開始エラー: ${result.message}`);
        }
      } catch (error) {
        alert(`録音開始エラー: ${error.message}`);
      }
    });

    // 会議終了
    // 停止ボタン（共通処理）
    async function handleStopRecording() {
      try {
        const result = await ipcRenderer.invoke('stop-recording');
        if (result.success) {
          isRecording = false;
          updateStatus(false);
        } else {
          alert(`録音停止エラー: ${result.message}`);
        }
      } catch (error) {
        alert(`録音停止エラー: ${error.message}`);
      }
    }

    stopBtn.addEventListener('click', handleStopRecording);
    stopBtnFloating.addEventListener('click', handleStopRecording);

    // 会議種別ロード
    async function loadMeetingTypes() {
      try {
        const response = await fetch('http://localhost:8000/meeting-types');
        const data = await response.json();
        
        meetingTypeSelect.innerHTML = '<option value="">選択してください</option>';
        data.meeting_types.forEach(type => {
          const option = document.createElement('option');
          option.value = type.id;
          option.textContent = type.name;
          meetingTypeSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Failed to load meeting types:', error);
        setTimeout(loadMeetingTypes, 5000);
      }
    }

    // モーダル制御（簡易版）
    document.getElementById('historyBtn').addEventListener('click', () => {
      document.getElementById('historyModal').style.display = 'flex';
    });

    document.getElementById('closeHistoryBtn').addEventListener('click', () => {
      document.getElementById('historyModal').style.display = 'none';
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      document.getElementById('settingsModal').style.display = 'flex';
    });

    document.getElementById('closeSettingsBtn').addEventListener('click', () => {
      document.getElementById('settingsModal').style.display = 'none';
    });
  </script>
</body>
</html>
