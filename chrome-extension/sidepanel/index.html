<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      background: #0a0f14;
      color: #e0e0e0;
      font-size: 13px;
      overflow: hidden;
      height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px;
      gap: 8px;
    }

    /* ヘッダー */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(20, 25, 30, 0.8);
      border: 1px solid rgba(0, 255, 170, 0.2);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 1rem;
      font-weight: 500;
      color: #00ffaa;
      letter-spacing: 1px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
      transition: background 0.3s;
    }

    .connection-dot.connected {
      background: #00ffaa;
    }

    /* 会議タイトル */
    .meeting-title-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(20, 25, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .meeting-title-bar label {
      color: #888;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    #meeting-title {
      flex: 1;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: #e0e0e0;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 0.85rem;
    }

    #meeting-title:focus {
      outline: none;
      border-color: #00ffaa;
    }

    /* コントロール */
    .controls {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: 1px solid;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-start {
      background: rgba(0, 255, 170, 0.15);
      border-color: #00ffaa;
      color: #00ffaa;
    }

    .btn-start:hover:not(:disabled) {
      background: rgba(0, 255, 170, 0.25);
    }

    .btn-stop {
      background: rgba(255, 68, 68, 0.15);
      border-color: #ff4444;
      color: #ff4444;
    }

    .btn-stop:hover:not(:disabled) {
      background: rgba(255, 68, 68, 0.25);
    }

    .btn-mute {
      background: rgba(100, 150, 255, 0.15);
      border-color: #6496ff;
      color: #6496ff;
      flex: 0 0 auto;
      padding: 10px 16px;
    }

    .btn-mute:hover:not(:disabled) {
      background: rgba(100, 150, 255, 0.25);
    }

    .btn-mute.muted {
      background: rgba(255, 150, 50, 0.15);
      border-color: #ff9632;
      color: #ff9632;
    }

    /* タブ */
    .tabs {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .tab {
      flex: 1;
      padding: 8px;
      background: rgba(20, 25, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px 6px 0 0;
      color: #888;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab.active {
      background: rgba(0, 255, 170, 0.1);
      border-color: rgba(0, 255, 170, 0.3);
      color: #00ffaa;
    }

    .tab .badge {
      display: inline-block;
      background: rgba(0, 255, 170, 0.2);
      color: #00ffaa;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 0.7rem;
      margin-left: 4px;
    }

    /* パネル */
    .panel {
      flex: 1;
      overflow-y: auto;
      background: rgba(20, 25, 30, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0 0 6px 6px;
      padding: 10px;
    }

    .panel::-webkit-scrollbar {
      width: 4px;
    }

    .panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .panel[hidden] {
      display: none;
    }

    /* 文字起こしエントリ */
    .transcript-entry {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      line-height: 1.5;
    }

    .transcript-entry .source {
      color: #00ffaa;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .transcript-entry .text {
      color: #ccc;
    }

    /* リサーチエントリ */
    .research-entry {
      padding: 8px 10px;
      margin-bottom: 6px;
      background: rgba(0, 255, 170, 0.05);
      border-left: 2px solid #00ffaa;
      border-radius: 0 4px 4px 0;
    }

    .research-entry .trigger {
      color: #00ffaa;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }

    .research-entry .content {
      color: #bbb;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .research-entry .time {
      color: #666;
      font-size: 0.7rem;
      margin-top: 4px;
    }

    /* 空状態 */
    .empty-state {
      color: #555;
      text-align: center;
      padding: 40px 20px;
      font-size: 0.85rem;
      line-height: 1.8;
    }

    /* ステータスバー */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(20, 25, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      font-size: 0.75rem;
      color: #666;
      flex-shrink: 0;
    }

    .status-bar .recording-indicator {
      display: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff4444;
      animation: blink 1s infinite;
    }

    .status-bar .recording-indicator.active {
      display: block;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Meeting Assistant</h1>
      <div class="connection-dot" id="connection-dot" title="未接続"></div>
    </div>

    <div class="meeting-title-bar">
      <label>会議:</label>
      <input type="text" id="meeting-title" placeholder="会議タイトルを入力..." />
    </div>

    <div class="controls">
      <button class="btn btn-start" id="btn-start">● 録音開始</button>
      <button class="btn btn-stop" id="btn-stop" disabled>■ 停止</button>
      <button class="btn btn-mute" id="btn-mute" disabled title="マイクミュート">🎤</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="transcript">
        文字起こし <span class="badge" id="transcript-count">0</span>
      </button>
      <button class="tab" data-tab="research">
        リサーチ <span class="badge" id="research-count">0</span>
      </button>
    </div>

    <div class="panel" id="panel-transcript">
      <div class="empty-state">
        録音を開始すると<br>文字起こしが表示されます
      </div>
    </div>

    <div class="panel" id="panel-research" hidden>
      <div class="empty-state">
        リサーチ結果が<br>ここに表示されます
      </div>
    </div>

    <div class="status-bar">
      <div class="recording-indicator" id="recording-indicator"></div>
      <span id="status-text">バックエンドに接続中...</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
